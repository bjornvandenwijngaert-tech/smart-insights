<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Report</title>
  <link rel="stylesheet" href="src/styles.css?v=1.1.3" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="16" y2="17"/>
          <line x1="10" y1="9" x2="8" y2="9"/>
        </svg>
        <span class="header-title">Activity <span>Report</span></span>
      </div>
      <div class="header-meta">
        <span id="db-name" class="db-badge"></span>
        <span class="version-badge">v1.1.3</span>
      </div>
    </header>

    <!-- Loading state -->
    <div id="loading" class="loading-screen">
      <div class="spinner"></div>
      <p>Connecting to MyGeotab...</p>
    </div>

    <!-- Main content -->
    <main id="main" class="main hidden">
      <section class="tab active">
        <div class="tab-toolbar">
          <h2 class="tab-title">Activity Report</h2>
          <div class="report-filters">
            <select id="range-length" class="select">
              <option value="1">Daily (1 day)</option>
              <option value="7" selected>Weekly (7 days)</option>
              <option value="30">Monthly (30 days)</option>
              <option value="custom">Custom range</option>
            </select>
            <input type="date" id="filter-from" class="input-date" />
            <input type="date" id="filter-to" class="input-date" />
            <div id="activity-cols-wrap" style="display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-left:4px">
              <label style="cursor:pointer;user-select:none"><input type="checkbox" id="col-total-engine" checked> Engine On (total)</label>
              <label style="cursor:pointer;user-select:none"><input type="checkbox" id="col-drive-only"> Driving Time</label>
              <label style="cursor:pointer;user-select:none"><input type="checkbox" id="col-idle-only"> Idle Time</label>
              <label style="cursor:pointer;user-select:none"><input type="checkbox" id="col-work-split"> Work / After-hours</label>
            </div>
            <select id="report-vehicle" class="select hidden"><option value="">All Vehicles</option></select>
            <button id="run-report" class="btn btn-primary">Run</button>
            <select id="export-format" class="select hidden">
              <option value="csv">CSV</option>
              <option value="excel">Excel</option>
              <option value="pdf">PDF</option>
            </select>
            <button id="export-activity-btn" class="btn btn-secondary hidden">Export</button>
          </div>
        </div>
        <div id="report-summary" class="report-summary hidden"></div>
        <div id="report-output" class="report-output">
          <p class="report-placeholder">Select a length and date range, then click Run.</p>
        </div>
      </section>
    </main>

  </div>

  <script src="src/logo-data.js?v=1.1.3"></script>
  <script src="src/app.js?v=1.1.3"></script>
</body>
</html>
